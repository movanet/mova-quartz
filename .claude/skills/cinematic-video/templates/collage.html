  const fp = clamp((p - 0.6) / 0.35); if (fp <= 0) return
  ctx.save(); ctx.translate(stem.at(-1)[0], -h); ctx.scale(back(fp), back(fp)); ctx.rotate(q12(p) * 0.2)
  for (let i = 0; i < 6; i++) { ctx.save(); ctx.rotate((i / 6) * Math.PI * 2); ctx.translate(0, -48); paper("blob", 56, 80, it.color, hash(it.x) + i, boil); ctx.restore() }
  paper("circle", 58, 58, C.mustard, hash(it.x) + 50, boil, { dots: true }); ctx.restore()
}
function bubble(it, boil) {
  const [tx, ty] = it.tail
  ctx.save(); ctx.shadowColor = "rgba(40,25,10,0.25)"; ctx.shadowOffsetY = 6; ctx.shadowBlur = 8
  ctx.fillStyle = C.white; ctx.beginPath(); ctx.moveTo(tx * 0.2 - 22, it.h * 0.3); ctx.lineTo(tx, ty); ctx.lineTo(tx * 0.2 + 22, it.h * 0.3); ctx.fill(); ctx.restore()
  paper("cloud", it.w, it.h, C.white, hash(it.x + it.y), boil, { edge: false })
  if (it.content === "scribble") { const r = rng(it.seed ?? 1); for (let l = 0; l < 3; l++) ink(Array.from({ length: 24 }, (_, i) => [-it.w * 0.3 + (i / 23) * it.w * (0.6 - l * 0.12), -30 + l * 30 + Math.sin(i * 1.3 + r() * 6) * 5]), 1, C.ink, 5, boil, l) }
  else if (it.content === "heart") { ctx.save(); ctx.scale(0.9, 0.9); paper("heart", it.h * 0.55, it.h * 0.5, C.red, 41, boil); ctx.restore() }
  else if (it.content === "star") paper("star", it.h * 0.6, it.h * 0.6, C.mustard, 42, boil)
  else { ctx.font = `700 ${it.h * 0.7}px Hand`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = C.red; ctx.fillText(it.content, 0, 6) }
}
const LIB = { paper, ink, text, tape, figure, plant, bubble, rng, hash, q12, lerp, clamp, easeOut, C }

// ---------- custom scene pieces (bespoke drawings are just functions) -----------------------
function skyCycle(p, lt, boil) { // sun and moon trading places: "thousands of years"
  const a = q12(lt) * 1.1
  for (const [k, col, shape] of [[0, C.mustard, "circle"], [Math.PI, C.white, "circle"]]) {
    ctx.save(); ctx.translate(960 + Math.cos(a + k) * 820, 640 - Math.sin(a + k) * 540)
    if (col === C.mustard) for (let i = 0; i < 10; i++) { const ra = (i / 10) * Math.PI * 2 + a; ink([[Math.cos(ra) * 70, Math.sin(ra) * 70], [Math.cos(ra) * 100, Math.sin(ra) * 100]], 1, C.mustard, 8, boil, i) }
    paper(shape, 110, 110, col, 60 + k, boil); ctx.restore()
  }
}
function pavement(p, lt, boil) { for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(160 + i * 330, 930); paper("rect", 310, 130, i % 2 ? "#b9b2a6" : "#c8c1b4", 200 + i, boil, { edge: false }); ctx.restore() } }
function ground(p, lt, boil) { ctx.save(); ctx.translate(960, 940); ctx.scale(easeOut(clamp(p * 3)), 1); paper("blob", 520, 90, "#7a5a3a", 300, boil); ctx.restore() }
function magnifier(p, lt, boil) { // sweeps the pavement looking for the coin
  const x = lerp(520, 1220, easeInOut(clamp(p))), y = 600 + Math.sin(p * 9) * 30
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5)
  ink([[70, 70], [170, 170]], 1, "#6b4a2b", 24, boil, 1)
  ctx.globalAlpha = 0.18; ctx.fillStyle = "#bfe3f2"; ctx.beginPath(); ctx.arc(0, 0, 95, 0, 7); ctx.fill(); ctx.globalAlpha = 1
  ink(Array.from({ length: 41 }, (_, i) => [Math.cos(i / 40 * 7) * 100, Math.sin(i / 40 * 7) * 100]), 1, C.ink, 12, boil, 2)
  ctx.restore()
}
function nightStars(p, lt, boil) { const r = rng(5); for (let i = 0; i < 26; i++) { const x = r() * W, y = r() * 600, s = 14 + r() * 26, tw = (Math.floor(lt * 3 + i) % 5) === 0 ? 0.6 : 1
  ctx.save(); ctx.translate(x, y); ctx.scale(tw * easeOut(clamp(p * 4 - i / 13)), tw * easeOut(clamp(p * 4 - i / 13))); paper("star", s, s, i % 3 ? C.white : C.mustard, 500 + i, boil, { edge: false }); ctx.restore() } }

// ---------- scene rendering -------------------------------------------------------------------
function drawItem(s, it, t) {
  const t0 = itemStart(s, it), len = (it.len ?? 0.6) * BEAT
  if (t < t0) return
  const tq = q12(t), p = clamp((tq - t0) / len), boil = Math.floor(tq / STEP / 2) // lines re-"boil" every 2 steps
  const r = rng(hash(JSON.stringify([it.kind, it.x, it.y, it.text])))
  ctx.save(); ctx.translate(it.x ?? 0, it.y ?? 0)
  ctx.rotate((((it.rot ?? 0) + (rng(boil + hash(it.x))() - 0.5) * 0.8) * Math.PI) / 180) // stop-motion wobble
  const a = it.anim ?? (it.kind === "custom" ? "none" : "pop") // custom drawings animate themselves
  let lift = 0
  if (a === "pop" || a === "grow") { const k = a === "pop" ? back(p) : easeOut(p); ctx.scale(Math.max(0.001, k), Math.max(0.001, k)) }
  else if (a === "drop") { const k = bounce(p); ctx.translate(0, (1 - k) * -260); ctx.rotate((1 - k) * 0.3); lift = 1 - clamp(p * 1.4) }
  else if (a.startsWith("slide")) { const d = { "slide-l": [-500, 0], "slide-r": [500, 0], "slide-u": [0, 400] }[a], k = easeOut(p); ctx.translate(d[0] * (1 - k), d[1] * (1 - k)) }
  if (it.kind === "shape") paper(it.shape, it.w, it.h, it.color, hash(JSON.stringify([it.x, it.y])), boil, { dots: it.dots, lift })
  else if (it.kind === "text") text(it, a === "write" ? easeInOut(p) : 1, boil)
  else if (it.kind === "figure") figure(it, boil, t - t0)
  else if (it.kind === "bubble") bubble(it, boil)
  else if (it.kind === "plant") plant(it, a === "grow" ? p : 1, boil)
  else if (it.kind === "ink") { // a path is one stroke (points) or several ([[points], [points]]) drawn in turn
    ctx.translate(-(it.x ?? 0), -(it.y ?? 0)); const out = inkPaths[it.path](it), strokes = Array.isArray(out[0][0]) ? out : [out], pp = a === "draw" ? easeInOut(p) : 1
    strokes.forEach((pts, k) => ink(pts, pp * strokes.length - k, it.color, it.width, boil, (r() * 1e6) | 0))
    if (it.path === "arrow" && p > 0.95) arrowHead(out, it.color, it.width, boil) }
  else if (it.kind === "custom") { ctx.translate(-(it.x ?? 0), -(it.y ?? 0)); it.draw(clamp((t - t0) / ((it.len ?? 8) * BEAT)), t - t0, boil, LIB) }
  ctx.restore()
}
function drawScene(s, t) {
  const p = clamp((t - s.start) / (s.end - s.start)), k = easeInOut(p)
  ctx.save()
  // One camera move per scene, smooth (the camera is not stop-motion; the paper is).
  const cam = s.camera ?? "push"
  if (cam === "push") { ctx.translate(W / 2, H / 2); ctx.scale(1 + 0.05 * k, 1 + 0.05 * k); ctx.translate(-W / 2, -H / 2) }
  else if (cam === "drift") ctx.translate(lerp(20, -20, k), 0)
  else if (cam === "tilt") { ctx.translate(W / 2, H / 2); ctx.rotate(lerp(-0.008, 0.008, k)); ctx.scale(1.03, 1.03); ctx.translate(-W / 2, -H / 2) }
  ctx.fillStyle = s.bg; ctx.fillRect(-60, -60, W + 120, H + 120)
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = 0.6; ctx.fillStyle = TEX_PAT; ctx.fillRect(-60, -60, W + 120, H + 120); ctx.restore()
  for (const it of s.items) drawItem(s, it, t)
  ctx.restore()
}
function tornWipe(x0) { // leading edge of the next sheet sliding in from the right
  const r = rng(7), path = new Path2D(); path.moveTo(W + 100, -50); path.lineTo(x0, -50)
  for (let y = -50; y <= H + 50; y += 18) path.lineTo(x0 + (r() - 0.5) * 26 + Math.sin(y / 90) * 18, y)
  path.lineTo(W + 100, H + 50); path.closePath(); return path
}
function captions(t) {
  if (!FILM.captions) return
  const L = N.segments.find((l) => t >= l.start && t <= l.start + l.dur + 0.4); if (!L) return
  // Reveal whole words as they are spoken (a word appears when the voice reaches its first letter).
  const n = L.text.length * clamp((t - L.start) / (L.dur * 0.96)), words = L.text.split(" ")
  let pos = 0, shown = ""
  for (const w of words) { if (pos > n) break; shown += (shown ? " " : "") + w; pos += w.length + 1 }
  ctx.save(); ctx.font = "400 46px Print"; ctx.textAlign = "center"; ctx.textBaseline = "middle"
  const w = ctx.measureText(L.text).width
  ctx.translate(W / 2, H - 70); ctx.globalAlpha = 0.92
  paper("rect", w + 70, 72, C.white, hash(L.id), Math.floor(q12(t) / STEP / 2), { edge: false })
  ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.fillText(shown, -w / 2, 2)
  ctx.restore()
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H)
  const i = FILM.scenes.findLastIndex((s) => t >= s.start), s = FILM.scenes[Math.max(0, i)]
  if (i > 0 && t < s.start + TRANS) { // paper-sheet wipe hides the cut
    const prev = FILM.scenes[i - 1]; drawScene(prev, prev.end - 0.001)
    const x0 = lerp(W + 60, -80, easeInOut((t - s.start) / TRANS))
    ctx.save(); const path = tornWipe(x0); ctx.clip(path); drawScene(s, t); ctx.restore()
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 24; ctx.shadowOffsetX = -8; ctx.strokeStyle = C.white; ctx.lineWidth = 8; ctx.stroke(tornWipe(x0)); ctx.restore()
  } else drawScene(s, t)
  captions(t)
  // Grain + vignette + fade in/out (opens from and closes to black so it loops).
  ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.fillStyle = GRAIN[Math.floor(q12(t) / STEP) % 4]; ctx.fillRect(0, 0, W, H); ctx.restore()
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(30,18,8,0.45)")
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H)
  const fade = Math.max(1 - clamp(t / (BEAT * 1.5)), clamp((t - (DURATION - BEAT * 3)) / (BEAT * 2.5)))
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${easeInOut(fade)})`; ctx.fillRect(0, 0, W, H) }
}

// ---------- checks + cues ----------------------------------------------------------------------
function check() {
  const warn = []
  if (N.placeholder) warn.push("narration is PLACEHOLDER silence with estimated timing: re-run tts.mjs with OmniVoice before the final render")
  FILM.scenes.forEach((s, i) => s.items.forEach((it, k) => {
    try { const t0 = itemStart(s, it); if (t0 > s.end - BEAT) warn.push(`scene ${i} item ${k} (${it.kind}) appears in the last beat of its scene`) } catch (e) { warn.push(e.message) }
  }))
  if (DURATION < 30 || DURATION > 60) warn.push(`duration ${DURATION}s is outside 30–60 s`)
  return warn
}
function cues() {
  const c = [], r3 = (x) => Math.round(x * 1000) / 1000
  FILM.scenes.forEach((s, i) => {
    if (i > 0) c.push({ t: r3(s.start), sfx: "paper", len: 0.45 })
    for (const it of s.items) {
      const t0 = itemStart(s, it)
      if (it.anim === "write" || it.anim === "draw") c.push({ t: r3(t0), sfx: "scribble", len: r3((it.len ?? 0.6) * BEAT) })
      else if (it.kind !== "custom" && ["pop", "drop", "grow"].includes(it.anim ?? "pop")) c.push({ t: r3(t0 + (it.anim === "drop" ? 0.6 * (it.len ?? 0.6) * BEAT : 0)), sfx: "pop" })
    }
    if (s.end === DURATION && s.end) c.push({ t: r3(s.L.start + s.L.dur), sfx: "chime" })
  })
  return { bpm: N.bpm, duration: DURATION, mood: FILM.mood, key: FILM.key, fadeOut: r3(BEAT * 3), cues: c.sort((a, b) => a.t - b.t) }
}

await document.fonts.load("700 100px Hand"); await document.fonts.load("400 40px Print"); await document.fonts.ready
window.SCENE = { width: W, height: H, fps: FILM.fps, duration: DURATION, ready: Promise.resolve(), render, check, cues }
if (P.has("t")) render(Number(P.get("t")))
</script>
</body>
