<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Private Casebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pleadings bundle. Sticky caption, a rail of sections, one reading pane; the two parties always sit left/right. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --surface-2: #e9eff1;
  --ink: #13222b;
  --ink-2: #455864;
  --muted: #6c7d88;
  --rule: #d5dfe4;
  --accent: #0d5f66;
  --accent-soft: #d6eced;
  --side-a: #eb6834;
  --side-a-soft: #fbe3d8;
  --side-b: #2a78d6;
  --side-b-soft: #dbe8f8;
  --both: #6c7d88;
  --heat-0: #eef3f5;
  --good: #1f7a4d;
  --warn: #9a6400;
  --crit: #b4302f;
  --shadow: 0 1px 2px rgba(19, 34, 43, .06), 0 4px 16px rgba(19, 34, 43, .05);
  --f-display: "Spectral", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: .8125rem;
  --step-0: .9375rem;
  --step-1: 1.125rem;
  --step-2: 1.4rem;
  --step-3: 1.85rem;
  --step-4: 2.5rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1418; --surface: #141d22; --surface-2: #1b262c; --ink: #e4ecef; --ink-2: #b4c3cb; --muted: #8b9ea8;
    --rule: #26353d; --accent: #63b9c0; --accent-soft: #163a3e; --side-a: #e0703f; --side-a-soft: #3a2218;
    --side-b: #4a91e8; --side-b-soft: #172a42; --both: #8b9ea8; --heat-0: #18232a; --good: #4fbf86; --warn: #e0a640; --crit: #ec7472;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #141d22; --surface-2: #1b262c; --ink: #e4ecef; --ink-2: #b4c3cb; --muted: #8b9ea8;
  --rule: #26353d; --accent: #63b9c0; --accent-soft: #163a3e; --side-a: #e0703f; --side-a-soft: #3a2218;
  --side-b: #4a91e8; --side-b-soft: #172a42; --both: #8b9ea8; --heat-0: #18232a; --good: #4fbf86; --warn: #e0a640; --crit: #ec7472;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--step-0); line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: var(--step-4); letter-spacing: -.01em; }
h2 { font-size: var(--step-3); }
h3 { font-size: var(--step-2); }
h4 { font-size: var(--step-1); }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
.tabular { font-variant-numeric: tabular-nums; }

/* ---------- gate ---------- */
#gate { min-height: 100vh; display: grid; place-items: center; padding-block: 48px; position: relative; overflow: hidden; background: radial-gradient(120% 80% at 50% 0%, var(--accent-soft) 0%, var(--bg) 60%); }
.gate-bay { position: absolute; inset: auto 0 0 0; width: 100%; height: 46vh; pointer-events: none; opacity: .9; }
.gate-card { position: relative; z-index: 1; }
.gate-card { width: 100%; max-width: 30rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 32px 28px; display: grid; gap: 18px; }
.gate-seal { display: flex; align-items: center; gap: 12px; }
.gate-seal svg { flex: none; }
.gate-card h1 { font-size: var(--step-3); }
.gate-card .lede { color: var(--ink-2); }
.gate-form { display: grid; gap: 10px; }
.gate-form label { font-weight: 600; font-size: var(--step--1); }
.gate-row { display: flex; gap: 8px; flex-wrap: wrap; }
.gate-row input { flex: 1 1 12rem; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--bg); color: var(--ink); }
.btn { font-weight: 600; padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.gate-msg { font-size: var(--step--1); min-height: 1.4em; color: var(--crit); }
.gate-foot { font-size: var(--step--1); color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }

/* ---------- shell ---------- */
#app[hidden] { display: none; }
.caption { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--rule); }
.caption-inner { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.caption-title { display: grid; gap: 0; min-width: 0; flex: 1 1 18rem; }
.caption-title strong { font-family: var(--f-display); font-size: var(--step-1); font-weight: 600; }
.caption-title span { font-size: var(--step--1); color: var(--ink-2); }
.party-a { color: var(--side-a); font-weight: 600; }
.party-r { color: var(--side-b); font-weight: 600; }
.caption-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search-box { font: inherit; font-size: var(--step--1); padding: 7px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--bg); color: var(--ink); width: 14rem; max-width: 100%; }
.icon-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; font-size: var(--step--1); }
.icon-btn:hover { background: var(--surface-2); }
.layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 32px; padding-block: 24px 64px; max-width: 84rem; margin: 0 auto; }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: grid; gap: 18px; max-height: calc(100vh - 96px); overflow: auto; }
.rail-group { display: grid; gap: 2px; }
.rail-group .eyebrow { padding: 0 10px 4px; }
.rail a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: var(--radius); font-size: var(--step--1); }
.rail a:hover { background: var(--surface-2); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail a .tag { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; align-content: start; }
section.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; min-width: 0; }
.view-head { display: grid; gap: 10px; max-width: 60rem; }
.view-head .lede { color: var(--ink-2); font-size: var(--step-1); max-width: 65ch; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; min-width: 0; overflow-wrap: anywhere; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.prose { max-width: 70ch; }
.prose p + p { margin-top: .8em; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: .72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink-2); white-space: normal; overflow-wrap: anywhere; cursor: default; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip { max-width: 100%; }
.chip.a, .chip.r { white-space: normal; border-radius: 8px; }
.chip.a { background: var(--side-a-soft); border-color: transparent; color: var(--ink); }
.chip.r { background: var(--side-b-soft); border-color: transparent; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.side-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.side-dot.a { background: var(--side-a); }
.side-dot.r { background: var(--side-b); }
.side-dot.b { background: var(--both); }
.empty { border: 1px dashed var(--rule); border-radius: 10px; padding: 24px; color: var(--ink-2); background: var(--surface); }
.empty strong { color: var(--ink); }

/* overview: submissions table */
.subs { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.subs-row { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 9rem minmax(0, 1fr); gap: 0; border-top: 1px solid var(--rule); }
.subs-row:first-child { border-top: 0; }
.subs-row > div { padding: 14px 16px; min-width: 0; }
.subs-head { background: var(--surface-2); font-weight: 600; font-size: var(--step--1); }
.subs-claim { display: grid; gap: 6px; align-content: start; border-right: 1px solid var(--rule); }
.subs-claim a { font-family: var(--f-display); font-weight: 600; font-size: var(--step-0); text-decoration: none; color: var(--ink); }
.subs-claim a:hover { color: var(--accent); }
.subs-a { border-left: 3px solid var(--side-a); }
.subs-r { border-left: 3px solid var(--side-b); }
.subs-meter { grid-column: 3; display: grid; align-content: center; justify-items: center; gap: 4px; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }

/* balance meter */
.balance { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 8rem; height: 10px; gap: 2px; }
.balance span { display: block; height: 100%; border-radius: 3px; }
.balance .ba { background: var(--side-a); justify-self: end; }
.balance .br { background: var(--side-b); justify-self: start; }
.balance-num { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }

/* pips */
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--rule); }
.pips.a i.on { background: var(--side-a); border-color: var(--side-a); }
.pips.r i.on { background: var(--side-b); border-color: var(--side-b); }

/* argument columns */
.issue { display: grid; gap: 14px; padding-top: 20px; border-top: 1px solid var(--rule); }
.issue:first-child { border-top: 0; padding-top: 0; }
.issue-q { display: flex; gap: 10px; align-items: baseline; }
.issue-q .mono { color: var(--muted); font-size: .8rem; flex: none; }
.issue-q h4 { font-size: var(--step-1); }
.args { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.args-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; min-width: 0; }
.args-col-head { display: flex; align-items: center; gap: 8px; font-size: var(--step--1); font-weight: 600; }
.arg { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.arg.a { border-left: 3px solid var(--side-a); }
.arg.r { border-left: 3px solid var(--side-b); }
.arg-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.arg-pos { font-weight: 500; min-width: 0; }
.arg-top .pips { flex: none; }
.arg details { font-size: var(--step--1); color: var(--ink-2); }
.arg summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
.arg summary::-webkit-details-marker { display: none; }
.arg summary::before { content: "+ "; font-family: var(--f-mono); }
.arg details[open] summary::before { content: "− "; }
.arg dl { display: grid; gap: 8px; margin: 8px 0 0; }
.arg dt { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.arg dd { margin: 0; }
.arg-none { font-size: var(--step--1); color: var(--muted); padding: 10px 0; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
thead th { border-top: 0; background: var(--surface-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.yes { color: var(--good); font-weight: 600; }
.no { color: var(--muted); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input { font: inherit; font-size: var(--step--1); padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); color: var(--ink); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: var(--step--1); cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }

/* charts */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; max-width: 100%; height: auto; }
.chart text { fill: var(--ink-2); font-family: var(--f-body); font-size: 12px; }
.chart .ax { stroke: var(--rule); }
.chart .grid { stroke: var(--rule); stroke-dasharray: 2 3; }
.chart .lbl-strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--step--1); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: var(--step--1); padding: 8px 10px; border-radius: 6px; max-width: 22rem; box-shadow: var(--shadow); line-height: 1.4; }
#tip b { font-weight: 600; }

/* timeline */
.tl { display: grid; gap: 0; position: relative; }
.tl-item { display: grid; grid-template-columns: 7.5rem 18px minmax(0, 1fr); gap: 12px; align-items: start; }
.tl-date { font-family: var(--f-mono); font-size: .78rem; color: var(--ink-2); text-align: right; padding-top: 2px; }
.tl-mark { position: relative; align-self: stretch; }
.tl-mark::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--rule); }
.tl-mark::after { content: ""; position: absolute; left: 4px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl-body { padding-bottom: 14px; display: grid; gap: 4px; min-width: 0; }

/* bay schematic */
.bay text { font-size: 11px; }

/* report */
.report { max-width: 72ch; }
.report h1 { font-size: var(--step-3); margin: 1.2em 0 .4em; }
.report h2 { font-size: var(--step-2); margin: 1.4em 0 .4em; }
.report h3 { font-size: var(--step-1); margin: 1.2em 0 .3em; }
.report p, .report ul, .report ol, .report blockquote, .report table { margin: 0 0 .9em; }
.report blockquote { border-left: 3px solid var(--rule); padding-left: 14px; color: var(--ink-2); }
.report table { display: block; overflow-x: auto; }
.report code { font-family: var(--f-mono); font-size: .85em; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
details.fold > summary { cursor: pointer; font-weight: 600; color: var(--accent); }

/* source text */
.cp-para { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); scroll-margin-top: 90px; }
.cp-para:first-child { border-top: 0; }
.cp-num { font-family: var(--f-mono); color: var(--muted); text-align: right; }
.cp-text { white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
.cp-para.hit { background: var(--accent-soft); border-radius: 6px; }
mark { background: var(--side-a-soft); color: var(--ink); padding: 0 2px; border-radius: 2px; }

/* drawer */
#drawer { position: fixed; z-index: 40; right: 0; top: 0; bottom: 0; width: min(30rem, 100vw); background: var(--surface); border-left: 1px solid var(--rule); box-shadow: var(--shadow); padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) 18px; overflow: auto; display: grid; gap: 12px; align-content: start; }
#drawer .cp-text { font-size: var(--step-0); }

.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: var(--step-2); font-weight: 600; font-variant-numeric: tabular-nums; }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  nav.rail { position: static; max-height: none; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  h1 { font-size: var(--step-3); }
  .args, .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .subs-row { grid-template-columns: minmax(0, 1fr); }
  .subs-claim, .subs-meter { border: 0; }
  .subs-meter { grid-column: auto; justify-items: start; }
  .subs-head { display: none; }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl-item { grid-template-columns: 5.5rem 18px minmax(0, 1fr); }
  .search-box { width: 100%; }
  nav.rail { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<div id="gate" class="wrap">
  <svg class="gate-bay" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 C 180 90, 320 150, 480 118 S 820 70, 980 112 S 1140 140, 1200 108 L1200 0 L0 0 Z" fill="var(--side-b-soft)"></path>
    <path d="M0 300 C 160 270, 300 330, 470 296 S 790 250, 960 292 S 1120 320, 1200 288 L1200 400 L0 400 Z" fill="var(--side-a-soft)"></path>
    <path d="M0 275 C 160 245, 300 305, 470 271 S 790 225, 960 267 S 1120 295, 1200 263" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 6" opacity=".55"></path>
  </svg>
  <div class="gate-card">
    <div class="gate-seal">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="20" fill="none" stroke="var(--accent)" stroke-width="2"></circle>
        <path d="M12 26h20M14 26v-8M19 26v-8M25 26v-8M30 26v-8M11 18l11-7 11 7z" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"></path>
        <path d="M11 30h22" stroke="var(--accent)" stroke-width="1.8"></path>
      </svg>
      <div>
        <div class="eyebrow">Private research notes</div>
      </div>
    </div>
    <h1>Private Casebook</h1>
    <p class="lede">This casebook is private. Enter the password to open it.</p>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <label for="pw">Password</label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
try { const t = localStorage.getItem("covenant-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw) {
  const env = JSON.parse($("#payload").textContent);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
// The app's markup and code are inside the encrypted bundle; nothing about the case is in this page in clear.
function boot(bundle) {
  const holder = document.createElement("div");
  holder.innerHTML = bundle.app_html;
  document.body.insertBefore(holder.firstElementChild, $("#drawer"));
  window.__COVENANT__ = bundle.data;
  const s = document.createElement("script");
  s.textContent = bundle.app_js;
  document.body.appendChild(s);
}
$("#gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value;
  $("#gate-msg").textContent = "Unlocking…";
  $("#gate-msg").style.color = "var(--muted)";
  let bundle;
  try { bundle = await decrypt(pw); } catch {
    $("#gate-msg").style.color = "var(--crit)";
    $("#gate-msg").textContent = "That password didn't unlock the casebook. Check it and try again.";
    return;
  }
  try { sessionStorage.setItem("covenant-pw", pw); } catch {}
  boot(bundle);
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem("covenant-pw"); } catch {}
  if (saved) { try { boot(await decrypt(saved)); } catch {} }
})();
})();
</script>
