<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="t d" font-size="12.5">
<title id="t">Tiga jalur dokumen lingkungan, ditentukan oleh besarnya dampak</title>
<desc id="d">Diagram keputusan: berdampak penting mengarah ke AMDAL; berpotensi berdampak mengarah ke UKL-UPL; selainnya SPPL. AMDAL dan UKL-UPL berujung pada Persetujuan Lingkungan; semuanya terintegrasi dengan perizinan berusaha.</desc>
<style>
.bg{fill:#ffffff}
.ink{fill:#18202b}.mut{fill:#5c6675}.acct{fill:#17704b}
.box{fill:#f3f5f7;stroke:#c5ccd4;stroke-width:1}
.plain{fill:#ffffff;stroke:#c5ccd4;stroke-width:1}
.acc{fill:#e7f2ec;stroke:#17704b;stroke-width:1.5}
.accsolid{fill:#17704b}
.ln{stroke:#8b949f;stroke-width:1.2;fill:none}
.lna{stroke:#17704b;stroke-width:1.6;fill:none}
.axis{stroke:#18202b;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.mk{fill:#8b949f}.mka{fill:#17704b}
.onacc{fill:#ffffff}
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){
.bg{fill:#12161b}
.ink{fill:#e7eaee}.mut{fill:#9ba5b1}.acct{fill:#5fcf98}
.box{fill:#1b2027;stroke:#3a434e}
.plain{fill:#12161b;stroke:#3a434e}
.acc{fill:#15291f;stroke:#5fcf98}
.accsolid{fill:#5fcf98}
.ln{stroke:#7d8793}.lna{stroke:#5fcf98}
.axis{stroke:#e7eaee}
.mk{fill:#7d8793}.mka{fill:#5fcf98}
.onacc{fill:#0d1a13}
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs>
<rect width="960" height="756" class="bg"/>
<text x="32" y="44" class="ink serif" font-size="22" font-weight="600" text-anchor="start">Tiga jalur dokumen lingkungan, ditentukan oleh besarnya dampak</text>
<text x="32" y="68" class="mut" font-size="13" font-weight="400" text-anchor="start">Penapisan menentukan apakah rencana usaha memerlukan AMDAL, UKL-UPL, atau cukup SPPL. Pertanyaan pertama adalah yang menentukan.</text>
<rect x="56" y="108" width="288" height="48" rx="6" class="box"/>
<text x="200.0" y="139" class="ink" font-size="14" font-weight="600" text-anchor="middle">Rencana usaha atau kegiatan</text>
<path d="M200 156 L200 172" class="ln" marker-end="url(#h)"/>
<polygon points="200,174.0 328.0,232 200,290.0 72.0,232" class="acc"/>
<text x="200" y="227" class="acct" font-size="13" font-weight="600" text-anchor="middle">Berdampak penting?</text>
<text x="200" y="245" class="ink" font-size="13" font-weight="400" text-anchor="middle">Pasal 23 UU 32/2009</text>
<path d="M200 290 L200 344" class="ln" marker-end="url(#h)"/>
<text x="210" y="322" class="mut" font-size="10.5" font-weight="400" text-anchor="start">tidak</text>
<polygon points="200,346.0 328.0,404 200,462.0 72.0,404" class="box"/>
<text x="200" y="399" class="ink" font-size="13" font-weight="600" text-anchor="middle">Berpotensi berdampak?</text>
<text x="200" y="417" class="ink" font-size="13" font-weight="400" text-anchor="middle">tetapi tidak penting</text>
<path d="M200 462 L200 516" class="ln" marker-end="url(#h)"/>
<text x="210" y="494" class="mut" font-size="10.5" font-weight="400" text-anchor="start">tidak</text>
<rect x="520" y="172" width="408" height="120" rx="6" class="box"/>
<text x="536" y="203" class="ink" font-size="14" font-weight="600" text-anchor="start">AMDAL</text>
<text x="536" y="220" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Kajian dampak yang dinilai kelayakannya. Wajib bila:</text>
<circle cx="539" cy="236.5" r="2.2" class="mut"/>
<text x="550" y="237" class="ink" font-size="12.5" font-weight="400" text-anchor="start">besaran usaha; wilayah sensitif; teknologi berisiko</text>
<circle cx="539" cy="253.5" r="2.2" class="mut"/>
<text x="550" y="254" class="ink" font-size="12.5" font-weight="400" text-anchor="start">dampak kumulatif; dampak sosial-budaya</text>
<path d="M328 232 L516 232" class="lna" marker-end="url(#ha)"/>
<text x="422" y="224" class="acct" font-size="10.5" font-weight="400" text-anchor="middle">ya</text>
<rect x="520" y="364" width="408" height="80" rx="6" class="box"/>
<text x="536" y="395" class="ink" font-size="14" font-weight="600" text-anchor="start">UKL-UPL</text>
<text x="536" y="412" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Tidak wajib AMDAL, tetapi berpotensi berdampak. Formulir</text>
<text x="536" y="429" class="ink" font-size="12.5" font-weight="400" text-anchor="start">diperiksa, bukan dinilai sebagai kajian.</text>
<path d="M328 404 L516 404" class="ln" marker-end="url(#h)"/>
<text x="422" y="396" class="mut" font-size="10.5" font-weight="400" text-anchor="middle">ya</text>
<rect x="56" y="520" width="288" height="108" rx="6" class="box"/>
<text x="72" y="551" class="ink" font-size="14" font-weight="600" text-anchor="start">SPPL</text>
<text x="72" y="568" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Pernyataan kesanggupan</text>
<text x="72" y="585" class="ink" font-size="12.5" font-weight="400" text-anchor="start">(self-declaration), didaftarkan ke</text>
<text x="72" y="602" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Dinas LH. Bukan hasil kajian.</text>
<rect x="520" y="520" width="408" height="64" rx="6" class="box"/>
<text x="536" y="551" class="ink" font-size="14" font-weight="600" text-anchor="start">Persetujuan Lingkungan</text>
<text x="536" y="568" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Menggantikan Izin Lingkungan sejak UU Cipta Kerja.</text>
<path d="M928 232 L944 232 L944 552 L932 552" class="ln" marker-end="url(#h)"/>
<path d="M724 444 L724 516" class="ln" marker-end="url(#h)"/>
<rect x="80" y="660" width="848" height="48" rx="6" class="box"/>
<text x="504.0" y="691" class="ink" font-size="14" font-weight="600" text-anchor="middle">Terintegrasi dengan Perizinan Berusaha berbasis risiko</text>
<path d="M200 628 L200 656" class="ln" marker-end="url(#h)"/>
<path d="M724 584 L724 656" class="ln" marker-end="url(#h)"/>
<text x="32" y="736" class="mut" font-size="11" font-weight="400" text-anchor="start">Sumber: BAB 5 bagian 1.2, 2.2, 3.1, dan 4; UU 32/2009 Pasal 23; PP 22/2021.</text>
</svg>
