<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" width="960" height="588" role="img" aria-labelledby="t d" font-size="12.5">
<title id="t">Apa yang tidak perlu dibuktikan penggugat dalam tanggung jawab mutlak</title>
<desc id="d">Tabel beban pembuktian untuk tanggung jawab berbasis kesalahan dan tanggung jawab mutlak, dengan baris kesalahan yang tidak perlu dibuktikan di bawah Pasal 88, serta pembelaan yang ditolak dan diterima secara terbatas.</desc>
<style>
.bg{fill:#ffffff}
.ink{fill:#18202b}.mut{fill:#5c6675}.acct{fill:#17704b}
.box{fill:#f3f5f7;stroke:#c5ccd4;stroke-width:1}
.plain{fill:#ffffff;stroke:#c5ccd4;stroke-width:1}
.acc{fill:#e7f2ec;stroke:#17704b;stroke-width:1.5}
.accsolid{fill:#17704b}
.ln{stroke:#8b949f;stroke-width:1.2;fill:none}
.lna{stroke:#17704b;stroke-width:1.6;fill:none}
.axis{stroke:#18202b;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.mk{fill:#8b949f}.mka{fill:#17704b}
.onacc{fill:#ffffff}
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){
.bg{fill:#12161b}
.ink{fill:#e7eaee}.mut{fill:#9ba5b1}.acct{fill:#5fcf98}
.box{fill:#1b2027;stroke:#3a434e}
.plain{fill:#12161b;stroke:#3a434e}
.acc{fill:#15291f;stroke:#5fcf98}
.accsolid{fill:#5fcf98}
.ln{stroke:#7d8793}.lna{stroke:#5fcf98}
.axis{stroke:#e7eaee}
.mk{fill:#7d8793}.mka{fill:#5fcf98}
.onacc{fill:#0d1a13}
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs>
<rect width="960" height="588" class="bg"/>
<text x="32" y="44" class="ink serif" font-size="22" font-weight="600" text-anchor="start">Apa yang tidak perlu dibuktikan penggugat dalam tanggung jawab mutlak</text>
<text x="32" y="68" class="mut" font-size="13" font-weight="400" text-anchor="start">Perbedaannya terletak pada satu baris: kesalahan. Tiga pembelaan yang biasa diajukan tergugat tidak berguna di bawah Pasal 88.</text>
<text x="32" y="116" class="mut" font-size="11.5" font-weight="600" text-anchor="start">YANG HARUS DIBUKTIKAN PENGGUGAT</text>
<text x="540" y="116" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Berbasis kesalahan</text>
<text x="540" y="132" class="mut" font-size="10.5" font-weight="400" text-anchor="middle">Pasal 87; Pasal 1365 KUHPerdata</text>
<text x="804" y="116" class="acct" font-size="12.5" font-weight="600" text-anchor="middle">Tanggung jawab mutlak</text>
<text x="804" y="132" class="mut" font-size="10.5" font-weight="400" text-anchor="middle">Pasal 88 UU 32/2009</text>
<rect x="32" y="148" width="896" height="52" rx="6" class="plain"/>
<text x="48" y="179.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Kerugian lingkungan atau kesehatan</text>
<rect x="452" y="158" width="176" height="32" rx="6" class="box"/>
<text x="540" y="179" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Dibuktikan</text>
<rect x="716" y="158" width="176" height="32" rx="6" class="box"/>
<text x="804" y="179" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Dibuktikan</text>
<rect x="32" y="208" width="896" height="52" rx="6" class="plain"/>
<text x="48" y="239.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Hubungan kausal antara kegiatan dan kerugian</text>
<rect x="452" y="218" width="176" height="32" rx="6" class="box"/>
<text x="540" y="239" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Dibuktikan</text>
<rect x="716" y="218" width="176" height="32" rx="6" class="box"/>
<text x="804" y="239" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Dibuktikan</text>
<rect x="32" y="268" width="896" height="52" rx="6" class="plain"/>
<text x="48" y="290.5" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Kegiatan termasuk kategori Pasal 88: B3, limbah B3,</text>
<text x="48" y="307.5" class="ink" font-size="12.5" font-weight="400" text-anchor="start">ancaman serius</text>
<text x="540" y="299" class="mut" font-size="12.5" font-weight="400" text-anchor="middle">Tidak relevan</text>
<rect x="716" y="278" width="176" height="32" rx="6" class="box"/>
<text x="804" y="299" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Dibuktikan</text>
<rect x="32" y="328" width="896" height="52" rx="6" class="plain"/>
<text x="48" y="350.5" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Kesalahan: lalai, sengaja, atau di bawah standar</text>
<text x="48" y="367.5" class="ink" font-size="12.5" font-weight="400" text-anchor="start">kehati-hatian</text>
<rect x="452" y="338" width="176" height="32" rx="6" class="box"/>
<text x="540" y="359" class="ink" font-size="12.5" font-weight="600" text-anchor="middle">Dibuktikan</text>
<rect x="716" y="338" width="176" height="32" rx="6" class="acc"/>
<text x="804" y="359" class="acct" font-size="12.5" font-weight="600" text-anchor="middle">Tidak perlu</text>
<text x="32" y="412" class="mut" font-size="11.5" font-weight="600" text-anchor="start">PEMBELAAN TERGUGAT DALAM TANGGUNG JAWAB MUTLAK</text>
<rect x="32" y="428" width="436" height="112" rx="6" class="plain"/>
<text x="48" y="459" class="ink" font-size="14" font-weight="600" text-anchor="start">Tidak diterima</text>
<circle cx="51" cy="475.5" r="2.2" class="mut"/>
<text x="62" y="476" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Saya tidak lalai</text>
<circle cx="51" cy="492.5" r="2.2" class="mut"/>
<text x="62" y="493" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Saya sudah berhati-hati</text>
<circle cx="51" cy="509.5" r="2.2" class="mut"/>
<text x="62" y="510" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Teknologi saya sudah yang terbaik</text>
<rect x="492" y="428" width="436" height="112" rx="6" class="box"/>
<text x="508" y="459" class="ink" font-size="14" font-weight="600" text-anchor="start">Diterima, secara terbatas</text>
<circle cx="511" cy="475.5" r="2.2" class="mut"/>
<text x="522" y="476" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Keadaan memaksa (force majeure)</text>
<circle cx="511" cy="492.5" r="2.2" class="mut"/>
<text x="522" y="493" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Kesalahan pihak ketiga</text>
<circle cx="511" cy="509.5" r="2.2" class="mut"/>
<text x="522" y="510" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Kesalahan penggugat sendiri</text>
<text x="32" y="568" class="mut" font-size="11" font-weight="400" text-anchor="start">Sumber: BAB 7 bagian 2.1, 2.3, dan 2.4; UU 32/2009 Pasal 87 dan 88; KUHPerdata Pasal 1365.</text>
</svg>
