<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 582" width="960" height="582" role="img" aria-labelledby="t d" font-size="12.5">
<title id="t">IRAC: analisis hukum terjadi di bagian A</title>
<desc id="d">Empat blok Issue, Rule, Application, dan Conclusion, dengan Application paling lebar. Busur putus-putus menandai kesalahan khas melompat dari Rule ke Conclusion, dan busur bawah menunjukkan Conclusion menjawab Issue.</desc>
<style>
.bg{fill:#ffffff}
.ink{fill:#18202b}.mut{fill:#5c6675}.acct{fill:#17704b}
.box{fill:#f3f5f7;stroke:#c5ccd4;stroke-width:1}
.plain{fill:#ffffff;stroke:#c5ccd4;stroke-width:1}
.acc{fill:#e7f2ec;stroke:#17704b;stroke-width:1.5}
.accsolid{fill:#17704b}
.ln{stroke:#8b949f;stroke-width:1.2;fill:none}
.lna{stroke:#17704b;stroke-width:1.6;fill:none}
.axis{stroke:#18202b;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.mk{fill:#8b949f}.mka{fill:#17704b}
.onacc{fill:#ffffff}
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){
.bg{fill:#12161b}
.ink{fill:#e7eaee}.mut{fill:#9ba5b1}.acct{fill:#5fcf98}
.box{fill:#1b2027;stroke:#3a434e}
.plain{fill:#12161b;stroke:#3a434e}
.acc{fill:#15291f;stroke:#5fcf98}
.accsolid{fill:#5fcf98}
.ln{stroke:#7d8793}.lna{stroke:#5fcf98}
.axis{stroke:#e7eaee}
.mk{fill:#7d8793}.mka{fill:#5fcf98}
.onacc{fill:#0d1a13}
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs>
<rect width="960" height="582" class="bg"/>
<text x="32" y="44" class="ink serif" font-size="22" font-weight="600" text-anchor="start">IRAC: analisis hukum terjadi di bagian A</text>
<text x="32" y="68" class="mut" font-size="13" font-weight="400" text-anchor="start">Empat bagian dalam urutan yang selalu sama. Bagian Application adalah tempat aturan bertemu fakta, unsur demi unsur.</text>
<rect x="32" y="160" width="176" height="152" rx="6" class="box"/>
<text x="48" y="204" class="ink serif" font-size="34" font-weight="600" text-anchor="start">I</text>
<text x="48" y="230" class="ink" font-size="14" font-weight="600" text-anchor="start">Issue</text>
<text x="48" y="252" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Pertanyaan hukum</text>
<text x="48" y="269" class="ink" font-size="12.5" font-weight="400" text-anchor="start">dalam satu kalimat,</text>
<text x="48" y="286" class="ink" font-size="12.5" font-weight="400" text-anchor="start">berbentuk pertanyaan.</text>
<rect x="232" y="160" width="176" height="152" rx="6" class="box"/>
<text x="248" y="204" class="ink serif" font-size="34" font-weight="600" text-anchor="start">R</text>
<text x="248" y="230" class="ink" font-size="14" font-weight="600" text-anchor="start">Rule</text>
<text x="248" y="252" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Aturan dikutip dari</text>
<text x="248" y="269" class="ink" font-size="12.5" font-weight="400" text-anchor="start">teks resminya,</text>
<text x="248" y="286" class="ink" font-size="12.5" font-weight="400" text-anchor="start">lengkap dengan pasal.</text>
<rect x="432" y="160" width="296" height="152" rx="6" class="acc"/>
<text x="448" y="204" class="acct serif" font-size="34" font-weight="600" text-anchor="start">A</text>
<text x="448" y="230" class="acct" font-size="14" font-weight="600" text-anchor="start">Application</text>
<text x="448" y="252" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Setiap unsur aturan dihubungkan dengan</text>
<text x="448" y="269" class="ink" font-size="12.5" font-weight="400" text-anchor="start">fakta yang sesuai, satu per satu.</text>
<text x="448" y="286" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Bagian terpanjang, dan yang paling</text>
<text x="448" y="303" class="ink" font-size="12.5" font-weight="400" text-anchor="start">sering dilewati.</text>
<rect x="752" y="160" width="176" height="152" rx="6" class="box"/>
<text x="768" y="204" class="ink serif" font-size="34" font-weight="600" text-anchor="start">C</text>
<text x="768" y="230" class="ink" font-size="14" font-weight="600" text-anchor="start">Conclusion</text>
<text x="768" y="252" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Jawaban atas Issue.</text>
<text x="768" y="269" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Bukan ringkasan</text>
<text x="768" y="286" class="ink" font-size="12.5" font-weight="400" text-anchor="start">seluruh tulisan.</text>
<path d="M208 236 L228 236" class="ln" marker-end="url(#h)"/>
<path d="M408 236 L428 236" class="ln" marker-end="url(#h)"/>
<path d="M728 236 L748 236" class="ln" marker-end="url(#h)"/>
<path d="M320 156 Q540 88 832 154" class="ln dash" marker-end="url(#h)"/>
<text x="576" y="112" class="mut" font-size="11" font-weight="400" text-anchor="middle">kesalahan khas: dari Rule langsung ke Conclusion, bagian A dianggap tersirat</text>
<path d="M840 316 Q480 396 120 318" class="ln dash" marker-end="url(#h)"/>
<text x="480" y="370" class="mut" font-size="11" font-weight="400" text-anchor="middle">Conclusion harus menjawab Issue</text>
<rect x="432" y="400" width="496" height="79" rx="6" class="acc"/>
<text x="448" y="431" class="acct" font-size="14" font-weight="600" text-anchor="start">Cara memeriksa bagian A</text>
<text x="448" y="448" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Hitung unsur dalam aturan yang Saudara kutip. Bila aturannya memuat</text>
<text x="448" y="465" class="ink" font-size="12.5" font-weight="400" text-anchor="start">tiga syarat, bagian A harus membicarakan ketiganya.</text>
<rect x="32" y="400" width="376" height="126" rx="6" class="plain"/>
<text x="48" y="427" class="mut" font-size="11" font-weight="600" text-anchor="start">CONTOH DALAM BAB INI</text>
<text x="48" y="444" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Issue: apakah pembuangan tailing ke laut dalam oleh</text>
<text x="48" y="461" class="ink" font-size="12.5" font-weight="400" text-anchor="start">perusahaan tambang nikel dapat dibenarkan</text>
<text x="48" y="478" class="ink" font-size="12.5" font-weight="400" text-anchor="start">berdasarkan PP 22/2021?</text>
<text x="48" y="495" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Rule: PP 22/2021 Pasal 390 sampai 395; Permen LHK</text>
<text x="48" y="512" class="ink" font-size="12.5" font-weight="400" text-anchor="start">6/2021.</text>
<text x="32" y="562" class="mut" font-size="11" font-weight="400" text-anchor="start">Sumber: BAB 10 bagian 5 dan 5.1.</text>
</svg>
