<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d" font-size="12.5">
<title id="t">Tiga pilar ESG, dan satu isu yang dibahas di mata kuliah lain</title>
<desc id="d">ESG terbagi menjadi lingkungan, sosial, dan tata kelola, masing-masing dengan daftar isu. Emisi gas rumah kaca ditandai sebagai materi HKL-302.</desc>
