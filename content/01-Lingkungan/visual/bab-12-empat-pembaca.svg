<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="t d" font-size="12.5">
<title id="t">Empat dokumen, empat pembaca, dan hanya satu di antaranya hakim</title>
<desc id="d">Empat kartu: memorandum hukum, gugatan, legal opinion, dan ringkasan kebijakan, masing-masing dengan pembaca, yang diinginkan pembaca, dan panjang lazim. Gugatan disorot karena hanya ia yang ditujukan kepada hakim.</desc>
<style>
.bg{fill:#ffffff}
.ink{fill:#18202b}.mut{fill:#5c6675}.acct{fill:#17704b}
.box{fill:#f3f5f7;stroke:#c5ccd4;stroke-width:1}
.plain{fill:#ffffff;stroke:#c5ccd4;stroke-width:1}
.acc{fill:#e7f2ec;stroke:#17704b;stroke-width:1.5}
.accsolid{fill:#17704b}
.ln{stroke:#8b949f;stroke-width:1.2;fill:none}
.lna{stroke:#17704b;stroke-width:1.6;fill:none}
.axis{stroke:#18202b;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.mk{fill:#8b949f}.mka{fill:#17704b}
.onacc{fill:#ffffff}
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){
.bg{fill:#12161b}
.ink{fill:#e7eaee}.mut{fill:#9ba5b1}.acct{fill:#5fcf98}
.box{fill:#1b2027;stroke:#3a434e}
.plain{fill:#12161b;stroke:#3a434e}
.acc{fill:#15291f;stroke:#5fcf98}
.accsolid{fill:#5fcf98}
.ln{stroke:#7d8793}.lna{stroke:#5fcf98}
.axis{stroke:#e7eaee}
.mk{fill:#7d8793}.mka{fill:#5fcf98}
.onacc{fill:#0d1a13}
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs>
<rect width="960" height="456" class="bg"/>
<text x="32" y="44" class="ink serif" font-size="22" font-weight="600" text-anchor="start">Empat dokumen, empat pembaca, dan hanya satu di antaranya hakim</text>
<text x="32" y="68" class="mut" font-size="13" font-weight="400" text-anchor="start">Dokumen berhasil bila cocok dengan pembacanya. Menulis semuanya seperti gugatan adalah kesalahan yang paling sering terjadi.</text>
<rect x="32" y="112" width="212" height="236" rx="6" class="box"/>
<text x="48" y="143" class="ink" font-size="14" font-weight="600" text-anchor="start">Memorandum hukum</text>
<text x="48" y="168" class="mut" font-size="11" font-weight="400" text-anchor="start">PEMBACA</text>
<text x="48" y="186" class="ink" font-size="13" font-weight="600" text-anchor="start">Atasan atau klien yang</text>
<text x="48" y="204" class="ink" font-size="13" font-weight="600" text-anchor="start">paham hukum</text>
<text x="48" y="229" class="mut" font-size="11" font-weight="400" text-anchor="start">YANG IA INGINKAN</text>
<text x="48" y="247" class="ink" font-size="13" font-weight="600" text-anchor="start">Jawaban, lalu alasannya</text>
<text x="48" y="272" class="mut" font-size="11" font-weight="400" text-anchor="start">PANJANG LAZIM</text>
<text x="48" y="290" class="ink" font-size="13" font-weight="600" text-anchor="start">3 sampai 8 halaman</text>
<rect x="260" y="112" width="212" height="236" rx="6" class="acc"/>
<text x="276" y="143" class="acct" font-size="14" font-weight="600" text-anchor="start">Gugatan</text>
<text x="276" y="168" class="mut" font-size="11" font-weight="400" text-anchor="start">PEMBACA</text>
<text x="276" y="186" class="ink" font-size="13" font-weight="600" text-anchor="start">Majelis hakim</text>
<text x="276" y="211" class="mut" font-size="11" font-weight="400" text-anchor="start">YANG IA INGINKAN</text>
<text x="276" y="229" class="ink" font-size="13" font-weight="600" text-anchor="start">Dalil yang memenuhi</text>
<text x="276" y="247" class="ink" font-size="13" font-weight="600" text-anchor="start">unsur</text>
<text x="276" y="272" class="mut" font-size="11" font-weight="400" text-anchor="start">PANJANG LAZIM</text>
<text x="276" y="290" class="ink" font-size="13" font-weight="600" text-anchor="start">Sesuai kebutuhan</text>
<rect x="488" y="112" width="212" height="236" rx="6" class="box"/>
<text x="504" y="143" class="ink" font-size="14" font-weight="600" text-anchor="start">Legal opinion</text>
<text x="504" y="168" class="mut" font-size="11" font-weight="400" text-anchor="start">PEMBACA</text>
<text x="504" y="186" class="ink" font-size="13" font-weight="600" text-anchor="start">Klien yang mengambil</text>
<text x="504" y="204" class="ink" font-size="13" font-weight="600" text-anchor="start">risiko</text>
<text x="504" y="229" class="mut" font-size="11" font-weight="400" text-anchor="start">YANG IA INGINKAN</text>
<text x="504" y="247" class="ink" font-size="13" font-weight="600" text-anchor="start">Tingkat keyakinan dan</text>
<text x="504" y="265" class="ink" font-size="13" font-weight="600" text-anchor="start">syaratnya</text>
<text x="504" y="290" class="mut" font-size="11" font-weight="400" text-anchor="start">PANJANG LAZIM</text>
<text x="504" y="308" class="ink" font-size="13" font-weight="600" text-anchor="start">5 sampai 15 halaman</text>
<rect x="716" y="112" width="212" height="236" rx="6" class="box"/>
<text x="732" y="143" class="ink" font-size="14" font-weight="600" text-anchor="start">Ringkasan kebijakan</text>
<text x="732" y="168" class="mut" font-size="11" font-weight="400" text-anchor="start">PEMBACA</text>
<text x="732" y="186" class="ink" font-size="13" font-weight="600" text-anchor="start">Pejabat, bukan sarjana</text>
<text x="732" y="204" class="ink" font-size="13" font-weight="600" text-anchor="start">hukum</text>
<text x="732" y="229" class="mut" font-size="11" font-weight="400" text-anchor="start">YANG IA INGINKAN</text>
<text x="732" y="247" class="ink" font-size="13" font-weight="600" text-anchor="start">Masalah, pilihan, dan</text>
<text x="732" y="265" class="ink" font-size="13" font-weight="600" text-anchor="start">rekomendasi</text>
<text x="732" y="290" class="mut" font-size="11" font-weight="400" text-anchor="start">PANJANG LAZIM</text>
<text x="732" y="308" class="ink" font-size="13" font-weight="600" text-anchor="start">2 sampai 4 halaman</text>
<path d="M366 384 L366 352" class="lna" marker-end="url(#ha)"/>
<text x="366" y="402" class="acct" font-size="12" font-weight="600" text-anchor="middle">Hanya satu dari empat pembaca adalah hakim.</text>
<text x="32" y="436" class="mut" font-size="11" font-weight="400" text-anchor="start">Sumber: BAB 12 bagian 1.</text>
</svg>
