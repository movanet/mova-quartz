<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604" role="img" aria-labelledby="t d" font-size="12.5">
<title id="t">Keadilan lingkungan punya tiga dimensi, bukan satu</title>
<desc id="d">Tiga dimensi keadilan lingkungan, yaitu distributif, prosedural, dan pengakuan, mengelilingi konsep keadilan lingkungan di tengah.</desc>
<style>
.bg{fill:#ffffff}
.ink{fill:#18202b}.mut{fill:#5c6675}.acct{fill:#17704b}
.box{fill:#f3f5f7;stroke:#c5ccd4;stroke-width:1}
.plain{fill:#ffffff;stroke:#c5ccd4;stroke-width:1}
.acc{fill:#e7f2ec;stroke:#17704b;stroke-width:1.5}
.accsolid{fill:#17704b}
.ln{stroke:#8b949f;stroke-width:1.2;fill:none}
.lna{stroke:#17704b;stroke-width:1.6;fill:none}
.axis{stroke:#18202b;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.mk{fill:#8b949f}.mka{fill:#17704b}
.onacc{fill:#ffffff}
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){
.bg{fill:#12161b}
.ink{fill:#e7eaee}.mut{fill:#9ba5b1}.acct{fill:#5fcf98}
.box{fill:#1b2027;stroke:#3a434e}
.plain{fill:#12161b;stroke:#3a434e}
.acc{fill:#15291f;stroke:#5fcf98}
.accsolid{fill:#5fcf98}
.ln{stroke:#7d8793}.lna{stroke:#5fcf98}
.axis{stroke:#e7eaee}
.mk{fill:#7d8793}.mka{fill:#5fcf98}
.onacc{fill:#0d1a13}
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mka"/></marker></defs>
<rect width="960" height="604" class="bg"/>
<text x="32" y="44" class="ink serif" font-size="22" font-weight="600" text-anchor="start">Keadilan lingkungan punya tiga dimensi, bukan satu</text>
<text x="32" y="68" class="mut" font-size="13" font-weight="400" text-anchor="start">Ketiganya saling melengkapi: siapa yang menanggung beban, siapa yang ikut memutuskan, dan siapa yang diakui.</text>
<path d="M480 156 L480 348" class="ln"/>
<path d="M172 500 L480 348" class="ln"/>
<path d="M788 500 L480 348" class="ln"/>
<rect x="340" y="108" width="280" height="96" rx="6" class="box"/>
<text x="356" y="139" class="ink" font-size="14" font-weight="600" text-anchor="start">Distributif</text>
<text x="356" y="156" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Pembagian beban dan manfaat</text>
<text x="356" y="173" class="ink" font-size="12.5" font-weight="400" text-anchor="start">lingkungan yang adil.</text>
<text x="356" y="192" class="mut" font-size="11" font-weight="400" text-anchor="start">Siapa yang menanggung?</text>
<rect x="32" y="452" width="280" height="96" rx="6" class="box"/>
<text x="48" y="483" class="ink" font-size="14" font-weight="600" text-anchor="start">Prosedural</text>
<text x="48" y="500" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Partisipasi yang adil dalam</text>
<text x="48" y="517" class="ink" font-size="12.5" font-weight="400" text-anchor="start">pengambilan keputusan.</text>
<text x="48" y="536" class="mut" font-size="11" font-weight="400" text-anchor="start">Siapa yang ikut memutuskan?</text>
<rect x="648" y="452" width="280" height="96" rx="6" class="box"/>
<text x="664" y="483" class="ink" font-size="14" font-weight="600" text-anchor="start">Pengakuan</text>
<text x="664" y="500" class="ink" font-size="12.5" font-weight="400" text-anchor="start">Penghormatan terhadap identitas dan</text>
<text x="664" y="517" class="ink" font-size="12.5" font-weight="400" text-anchor="start">budaya.</text>
<text x="664" y="536" class="mut" font-size="11" font-weight="400" text-anchor="start">Siapa yang diakui?</text>
<circle cx="480" cy="348" r="80" class="acc"/>
<text x="480" y="344" class="acct" font-size="16" font-weight="600" text-anchor="middle">Keadilan</text>
<text x="480" y="364" class="acct" font-size="16" font-weight="600" text-anchor="middle">lingkungan</text>
<text x="32" y="584" class="mut" font-size="11" font-weight="400" text-anchor="start">Sumber: BAB 6 bagian 1.4.</text>
</svg>
